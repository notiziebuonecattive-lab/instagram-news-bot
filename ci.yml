name: Controlli automatici (nessuna pubblicazione)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m newsbot.cli prepare --kind demo
      - uses: actions/upload-artifact@v4
        with:
          name: preview-instagram
          path: site/
