name: Instagram - esecuzione MANUALE (pubblicazione bloccata di default)

# Non aggiungere schedule finché non sono stati approvati i test live.
# Per attivare l'automazione, aggiungere sotto "on:" le 3 righe seguenti
# togliendo il carattere # (oltre ad ALLOW_PUBLISH=true):
#   schedule:
#     - cron: '0 12 * * 2,5'
#       timezone: 'Europe/Rome'
# Le tre categorie vengono ruotate fra i due slot settimanali.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'Demo gratuita o ricerca reale positiva/negativa/curiosita (consuma credito)'
        required: true
        type: choice
        options: [demo, positive, negative, curiosity]
        default: demo
      publish:
        description: 'INVIA A BUFFER (richiede anche Variable ALLOW_PUBLISH=true)'
        required: true
        default: false
        type: boolean

concurrency:
  group: instagram-news-bot
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
      ALLOW_PUBLISH: ${{ vars.ALLOW_PUBLISH || 'false' }}
      KIND_REQUESTED: ${{ inputs.kind || 'auto' }}
      REQUEST_PUBLISH: ${{ inputs.publish || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test locale prima di eseguire
        run: python -m compileall -q newsbot
      - name: Determina tipo e blocchi di sicurezza
        shell: bash
        run: |
          KIND="$KIND_REQUESTED"
          DO_PUBLISH="$REQUEST_PUBLISH"
          if [[ "$KIND" == "auto" ]]; then
            KIND=$(python -m newsbot.cli choose-kind)
            if [[ -z "$KIND" ]]; then
              echo 'Impossibile determinare categoria automatica' >&2; exit 1
            fi
            DO_PUBLISH="true"
          fi
          if [[ "$DO_PUBLISH" == "true" && "$ALLOW_PUBLISH" != "true" ]]; then
            echo 'Pubblicazione bloccata: ALLOW_PUBLISH deve essere true' >&2
            exit 1
          fi
          if [[ "$KIND" == "demo" && "$DO_PUBLISH" == "true" ]]; then
            echo 'Una demo non può essere pubblicata' >&2; exit 1
          fi
          echo "KIND=$KIND" >> "$GITHUB_ENV"
          echo "DO_PUBLISH=$DO_PUBLISH" >> "$GITHUB_ENV"
      - name: Prepara notizia o demo
        run: |
          if [[ "$DO_PUBLISH" == 'true' ]]; then
            python -m newsbot.cli prepare --kind "$KIND" --reserve
          else
            python -m newsbot.cli prepare --kind "$KIND"
          fi
      - name: Salva prenotazione nel repository PRIMA dell'invio
        if: ${{ env.DO_PUBLISH == 'true' && vars.ALLOW_PUBLISH == 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json site/
          git commit -m 'Reserve verified Instagram story (no Buffer call yet)'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Pubblica le immagini su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Invia una sola volta a Buffer (nessun retry delle scritture)
        if: ${{ env.DO_PUBLISH == 'true' && vars.ALLOW_PUBLISH == 'true' }}
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python -m newsbot.cli publish --base-url "$PAGE_URL"
      - name: Registra esito restituito da Buffer
        if: ${{ env.DO_PUBLISH == 'true' && vars.ALLOW_PUBLISH == 'true' }}
        run: |
          git add data/state.json site/index.html
          git commit -m 'Record Buffer acceptance (not Instagram delivery confirmation)'
          git push
